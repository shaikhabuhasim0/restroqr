<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — RestroQR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:      #c0392b;
      --primary-dark: #962d22;
      --primary-light:#fdecea;
      --gold:         #d4a017;
      --gold-light:   #fdf8ed;
      --bg:           #faf8f5;
      --card-bg:      #fffefb;
      --border:       #e8e0d5;
      --text:         #2c1a0e;
      --text-muted:   #8c7b6b;
      --danger:       #e74c3c;
      --danger-light: #fdecea;
    }

    html, body {
      height: 100%;
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Subtle static warmth in the corners — no motion, just depth */
    body {
      background-image:
        radial-gradient(ellipse 55% 45% at 8% 5%, rgba(212,160,23,0.08), transparent 60%),
        radial-gradient(ellipse 55% 45% at 95% 100%, rgba(192,57,43,0.06), transparent 60%);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card-wrap {
      width: 100%;
      max-width: 400px;
      animation: cardReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 42px 38px 34px;
      box-shadow: 0 4px 16px rgba(44,26,14,0.06), 0 20px 48px rgba(44,26,14,0.09);
      position: relative;
      overflow: hidden;
    }

    /* Thin brand-colored top bar — the one signature flourish */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold) 0%, var(--primary) 55%, var(--primary-dark) 100%);
    }

    /* ── BRAND ─── */
    .brand { text-align: center; margin-bottom: 28px; }

    .brand-logo {
      width: 62px; height: 62px;
      border-radius: 16px;
      background: linear-gradient(145deg, var(--primary) 0%, var(--primary-dark) 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(192,57,43,0.28);
    }

    .brand h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.1;
      margin-bottom: 5px;
    }
    .brand h1 .hl { color: var(--primary); font-style: italic; font-weight: 600; }

    .brand-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* Ornament divider */
    .ornament {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0 26px;
    }
    .ornament-line { flex: 1; height: 1px; background: var(--border); }
    .ornament-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); opacity: 0.75; }

    /* ── ERROR ─── */
    .login-error {
      display: none;
      background: var(--danger-light);
      border-left: 3px solid var(--danger);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #b53a2c;
      margin-bottom: 20px;
      animation: shakeErr 0.4s ease;
    }
    .login-error.show { display: block; }
    @keyframes shakeErr {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      50%      { transform: translateX(6px); }
      75%      { transform: translateX(-3px); }
    }

    /* ── FORM ─── */
    .form-group { margin-bottom: 18px; }

    .form-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .input-wrap { position: relative; }

    .form-input {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 12px 15px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .form-input::placeholder { color: #b8a898; }
    .form-input:hover { border-color: #d8c8a8; }
    .form-input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    .form-input.has-addon { padding-right: 46px; }

    .input-addon {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-muted);
      padding: 8px;
      line-height: 1;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
    }
    .input-addon:hover { color: var(--primary); background: var(--primary-light); }

    /* ── META ROW ─── */
    .row-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 24px;
    }
    .remember-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .remember-label input[type=checkbox] {
      accent-color: var(--primary);
      width: 15px; height: 15px;
      cursor: pointer;
    }
    .change-pw {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }
    .change-pw:hover { text-decoration: underline; }

    /* ── BUTTON ─── */
    .btn-signin {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 6px 18px rgba(192,57,43,0.3);
    }
    .btn-signin:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(192,57,43,0.4); }
    .btn-signin:active { transform: translateY(0); }

    .btn-signin.loading { pointer-events: none; opacity: 0.75; }
    .btn-signin .btn-text { transition: opacity 0.2s; }
    .btn-signin.loading .btn-text { opacity: 0; }
    .btn-signin .spinner {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
    }
    .btn-signin.loading .spinner { display: flex; }
    .spinner svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── HINT ─── */
    .default-hint {
      margin-top: 18px;
      text-align: center;
      font-size: 0.76rem;
      color: var(--text-muted);
      padding: 9px 12px;
      border: 1px dashed var(--border);
      border-radius: 9px;
      background: var(--gold-light);
    }
    .default-hint strong { color: var(--primary-dark); font-weight: 700; }
  </style>
</head>
<body>

<div class="page">
  <div class="card-wrap">
    <div class="card">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-logo">🍴</div>
        <h1>Restro<span class="hl">QR</span></h1>
        <p class="brand-sub">Restaurant Admin Portal</p>
      </div>

      <div class="ornament">
        <div class="ornament-line"></div>
        <div class="ornament-dot"></div>
        <div class="ornament-line"></div>
      </div>

      <!-- Error -->
      <div class="login-error" id="loginError">⚠️ Invalid Admin ID or Password. Please try again.</div>

      <!-- Admin ID -->
      <div class="form-group">
        <label class="form-label" for="adminId">Admin ID</label>
        <div class="input-wrap">
          <input class="form-input" type="text" id="adminId" placeholder="Enter your admin ID" autocomplete="username">
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="adminPass">Password</label>
        <div class="input-wrap">
          <input class="form-input has-addon" type="password" id="adminPass" placeholder="Enter your password" autocomplete="current-password">
          <button class="input-addon" id="togglePwd" type="button" title="Toggle password visibility">👁️</button>
        </div>
      </div>

      <!-- Remember / Change PW -->
      <div class="row-meta">
        <label class="remember-label">
          <input type="checkbox" id="rememberMe">
          Remember me
        </label>
        <a href="/admin/settings" class="change-pw">Change Password</a>
      </div>

      <!-- Sign In Button -->
      <button class="btn-signin" id="signinBtn" onclick="doLogin()">
        <span class="btn-text">Sign In</span>
        <span class="spinner">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </span>
      </button>

      <!-- Default hint -->
      <div class="default-hint">
        Default — ID: <strong>encripted</strong> &nbsp;·&nbsp; Password: <strong>encrepted</strong>
      </div>

    </div>
  </div>
</div>

<script>
  /* ── SESSION CHECK ── */
  if (sessionStorage.getItem('rq_session') || localStorage.getItem('rq_remember')) {
    window.location.href = '/admin/dashboard';
  }

  /* ── PASSWORD TOGGLE ── */
  document.getElementById('togglePwd').addEventListener('click', function () {
    const inp = document.getElementById('adminPass');
    if (inp.type === 'password') { inp.type = 'text'; this.textContent = '🙈'; }
    else                         { inp.type = 'password'; this.textContent = '👁️'; }
  });

  /* ── ENTER KEY ── */
  document.getElementById('adminId').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('adminPass').focus();
  });
  document.getElementById('adminPass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  /* ── LOGIN ── */
  async function doLogin() {
    const id   = document.getElementById('adminId').value.trim();
    const pass = document.getElementById('adminPass').value;
    const rem  = document.getElementById('rememberMe').checked;
    const err  = document.getElementById('loginError');
    const btn  = document.getElementById('signinBtn');

    err.classList.remove('show');

    if (!id || !pass) {
      err.textContent = '⚠️ Please enter both Admin ID and Password.';
      err.classList.add('show');
      return;
    }

    btn.classList.add('loading');

    try {
      const res  = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: id, password: pass })
      });
      const data = await res.json();

      if (data.success) {
        sessionStorage.setItem('rq_session', '1');
        if (rem) localStorage.setItem('rq_remember', '1');
        else localStorage.removeItem('rq_remember');
        window.location.href = '/admin/dashboard';
      } else {
        btn.classList.remove('loading');
        err.textContent = '⚠️ Invalid Admin ID or Password.';
        err.classList.add('show');
        document.getElementById('adminPass').value = '';
      }
    } catch (e) {
      btn.classList.remove('loading');
      err.textContent = '⚠️ Server error. Please try again.';
      err.classList.add('show');
    }
  }
</script>
</body>
</html>
